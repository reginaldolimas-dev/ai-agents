  - id: SISPEN-RED-01
    titulo: "Proibição Total de Redux em Código Novo"
    categoria: "arquitetura"
    severidade: "bloqueadora"
    confianca: "confirmada_doc"
    descricao: "É terminantemente proibido criar actions, reducers ou integrar novos componentes à store do Redux legado. Usar Custom Hooks + Context API."
    contexto: "Qualquer nova feature ou refatoração no SISPEN Client."
    excecoes: "Manutenção estrita em módulos legados existentes sem refatoração."

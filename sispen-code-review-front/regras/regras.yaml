    titulo: "Purga de Código Morto e Imports Não Utilizados"
    categoria: "limpeza"
    severidade: "media"
    confianca: "recorrente_evidencias"
    descricao: "Remover blocos de código comentados e imports desnecessários antes do merge. Comentários JSDoc são permitidos."
    contexto: "Todos os arquivos de código do repositório."
    excecoes: "JSDocs (@param, @returns) em funções utilitárias."
